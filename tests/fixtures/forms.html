<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form defects</title>
  <style>body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; } input, button { font: inherit; padding: 8px; margin: 4px 0; display: block; }</style>
</head>
<body>
  <main>
    <h1>Forms fixture</h1>
    <!-- Must never actually be submitted: the action points at a non-existent host. -->
    <form id="signup" action="https://example.invalid/submit" method="post">
      <input id="nolabel" name="nickname" type="text" placeholder="Nickname">
      <label for="email-as-text">Email</label>
      <input id="email-as-text" name="email" type="text" required value="qa-secret-value">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password">
      <label for="code">Code</label>
      <input id="code" name="code" type="text" pattern="[0-9]{4}">
      <button id="signup-submit" type="submit">Create account</button>
    </form>
    <!-- Two text fields and no submit button: Enter does not submit (no implicit submission), so it cannot be sent. -->
    <form id="nosubmit" action="#">
      <label for="q2">First name</label>
      <input id="q2" name="q2" type="text">
      <label for="q3">Last name</label>
      <input id="q3" name="q3" type="text">
    </form>
    <!-- One text field: Enter submits implicitly, so this must not be flagged. -->
    <form id="implicit" action="#">
      <label for="q4">Coupon</label>
      <input id="q4" name="q4" type="text">
    </form>
  </main>
  <script>
    // Records whether any form actually got submitted (navigation would also fail the harness run).
    window.__submitted = 0;
    document.addEventListener("submit", () => window.__submitted++, false);
  </script>
  <script type="application/json" id="qa-expect">
    {
      "categories": ["forms"],
      "options": { "formInteractive": true },
      "present": [
        { "testId": "forms.labels", "selectorIncludes": "nolabel" },
        { "testId": "forms.input-types", "selectorIncludes": "email-as-text" },
        { "testId": "forms.submit-mechanism", "selectorIncludes": "nosubmit" },
        { "testId": "forms.interactive-validation" },
        { "testId": "forms.server-response", "status": "manual" }
      ],
      "absent": [
        { "testId": "forms.submit-mechanism", "selectorIncludes": "implicit" }
      ]
    }
  </script>
  <script src="harness.js"></script>
</body>
</html>
