<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <title>Why are you leaving? – Website Page Auditor</title>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/main-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/main-32.png">
  <link rel="stylesheet" href="leave.css">
</head>
<body>
  <main class="leave-shell">
    <header class="brand"><img src="icons/main-128.png" width="44" height="44" alt=""><div><a class="back" href="popup.html">Website Page Auditor</a><small>Find and review issues on any webpage.</small></div></header>
    <section class="survey-card" aria-labelledby="title">
      <div class="survey-heading"><div><p class="eyebrow">OPTIONAL FEEDBACK</p><h1 id="title">Why are you leaving?</h1><p class="intro">Pick a reason or leave a quick note.</p></div><div class="mini-results" aria-hidden="true"><div><span>✓</span>Page checked</div><div><span>↗</span>Findings reviewed</div></div></div>

      <form id="leaveForm">
        <fieldset>
          <legend>What could be better? <span>Select any</span></legend>
          <label class="reason"><input type="checkbox" name="reason" value="Missing features"><span>Missing features</span></label>
          <label class="reason"><input type="checkbox" name="reason" value="Hard to use"><span>Hard to use</span></label>
          <label class="reason"><input type="checkbox" name="reason" value="Performance or page issues"><span>Performance or page issues</span></label>
          <label class="reason"><input type="checkbox" name="reason" value="Privacy or permissions"><span>Privacy or permissions</span></label>
          <label class="reason"><input type="checkbox" name="reason" value="Found another tool"><span>Found another tool</span></label>
          <label class="reason"><input type="checkbox" name="reason" value="Only needed it once"><span>Only needed it once</span></label>
          <label class="reason"><input type="checkbox" name="reason" value="Other"><span>Other</span></label>
        </fieldset>

        <label class="comment-label" for="comment">A note <span>Optional</span></label>
        <textarea id="comment" maxlength="500" rows="4" placeholder="Share a thought or suggestion…"></textarea>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div class="actions">
          <button id="submitAndUninstall" class="primary" type="submit">Continue to uninstall</button>
          <button id="uninstallWithoutFeedback" class="quiet" type="button">Uninstall without feedback</button>
        </div>
      </form>
    </section>
    <footer><a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a> · Website Page Auditor</footer>
  </main>
  <script src="js/leave.js"></script>
</body>
</html>
